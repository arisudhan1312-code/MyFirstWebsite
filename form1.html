<html>
    <head>
        <title>Form</title>
    </head>
    <body action="hh.html">
        <center><section style="background-color:lightgreen;height:100px;width:60%;">
            <center><h1 style="color:blue;padding-top:20px;">hack<sub>event</sub></h1></center>
        </section></center><hr
        <section style="padding:20px;"><center><div">
            <label id="fname">first name:</label>
            <input type="text" name="fname" placeholder="enter your first name"></div><div style="margin-top:15px;">
            <label id="lname">Last name:</label>
            <input type="text" name="lname" placeholder="enter your last name">
            </div></center>
            <center><div style="margin-top:15px">
                <label id="email">Email:</label>
                <input type="email" name="email" placeholder="email"></div><div style="margin-top:15px;">
                <label id="password">Password:</label>
                <input type="password" name="password" placeholder="password">
            </div></center><center>
            <div style="margin-top:20px;">
                <label id="dept">Department:</label>
                <select name="dept">
                    <option value="other">other</option>
                    <option value="it">IT</option>
                    <option value="CSE">CSE</option>
                    <option value="aids">AIDS</option>
                </select>
            </div></center>
            <div style="margin-top:15px">
                <center>
                    <label id="gender">Gender:</label>
                    <input type="radio" name="gender" value ="male">MALE
                    <input type="radio"name="gender" value="female">Female
                </center>
            </div>
        </section>
        <section style="background-color:aquamarine;height:150px;margin-top:50px">
         <div style="margin-top:15px;"><center><label id="feed">Explain your project:</label>
            <input type="namespace" name="feed" placeholder="Your project"></center></div><div style="margin-top:30px"><center>
          <label id="file" style="margin-top:5px;">upload your project:</label>
          <input type="file" name="file"> </center></div>
        </section>
        <section>
            <button style="margin-top:20px;size:120px;margin-left:75%">Submit</button>
        </section>
        <footer style="background-color:darkgray;">
            <center><p>&copy; 2023 Hackathon. All rights reserved.</p></center>
            <div style="display:inline-block">contact us:0123456678</div>
            <div style="display:inline-block;margin-left:65%">email:arisiddf@gmail.com</div>
        </footer>
    </body>
</html>
