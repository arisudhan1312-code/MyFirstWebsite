
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
        }

        .login {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background-color: white;
            text-align: center;
            border-radius: 8px;
        }

        input {
            padding: 8px;
            margin: 10px;
            width: 90%;
        }

        button {
            background-color: blue;
            color: white;
            padding: 8px 20px;
            border: none;
        }
    </style>
</head>

<body>

    <div class="login">
        <h2>Login</h2>

        <form>
            <input type="email" placeholder="Enter Email">
            <input type="password" placeholder="Enter Password">

            <button type="submit">Login</button>
        </form>

        <p>Don't have an account? Sign Up</p>
    </div>

</body>
</html>
